name: ci-node

on:
  push:
    branches: [main]
    paths:
      - "node/**"
      - "conformance/**"
      - ".github/workflows/ci-node.yml"
  pull_request:
    branches: [main]
    paths:
      - "node/**"
      - "conformance/**"
      - ".github/workflows/ci-node.yml"

defaults:
  run:
    working-directory: 3d-tiles-core/node

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v7
        with:
          path: 3d-tiles-core
      - uses: actions/checkout@v7
        with:
          repository: pandaGaume/spacexr-tiling
          path: spacexr-tiling
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: 3d-tiles-core/node/package-lock.json
      - name: Build spacexr-tiling
        working-directory: spacexr-tiling
        run: |
          npm ci
          npm run build
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

