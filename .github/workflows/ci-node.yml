name: ci-node

on:
  push:
    branches: [main]
    paths:
      - "node/**"
      - "conformance/**"
      - ".github/workflows/ci-node.yml"
  pull_request:
    branches: [main]
    paths:
      - "node/**"
      - "conformance/**"
      - ".github/workflows/ci-node.yml"

defaults:
  run:
    working-directory: node

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

